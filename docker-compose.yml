services:
  postgres:
    image: postgres:16-alpine
    container_name: ufabc_db
    restart: always
    environment:
      POSTGRES_USER: ufabc_app
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ufabc_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # cria as tabelas automaticamente na primeira subida do container
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

volumes:
  postgres_data:
